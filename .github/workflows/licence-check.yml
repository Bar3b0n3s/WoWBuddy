name: Licence check

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

# The project is MIT and links only permissive dependencies. A copyleft package slipping
# into the graph would be a licensing problem rather than a build problem, so it gets its
# own check that fails loudly instead of being noticed years later.
jobs:
  packages:
    name: No copyleft dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WoWBuddy.NoUI.slnf

      - name: List resolved packages
        run: dotnet list WoWBuddy.NoUI.slnf package --include-transitive > packages.txt

      - name: Show resolved packages
        run: cat packages.txt

      - name: Fail on known copyleft packages
        shell: bash
        run: |
          # Package names known to be GPL/LGPL/AGPL that must never enter the graph.
          # Kept as an explicit deny list: a name-based heuristic would be noise.
          DENY='AmeisenBotX|TrinityCore|AzerothCore|MySql\.Data|GPL'
          if grep -Ei "$DENY" packages.txt; then
            echo "::error::A copyleft or disallowed package is in the dependency graph."
            exit 1
          fi
          echo "No disallowed packages found."
