name: Licence check

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# WoWBuddy ships under MIT and links only permissive dependencies. A copyleft package
# entering the graph would be a licensing problem rather than a build problem, so it gets
# its own check that fails loudly instead of being noticed years later.
jobs:
  packages:
    name: Dependency licence allow-list
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WoWBuddy.NoUI.slnf

      - name: Check every package against the allow-list
        run: ./build/check-licences.sh
