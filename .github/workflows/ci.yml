name: CI

on:
  push:
    branches: [ main, master, "claude/**" ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # The real gate. WPF needs the Windows Desktop SDK, and the bot only ever runs on
  # Windows, so this is the build that has to be green.
  windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WoWBuddy.sln

      - name: Build
        run: dotnet build WoWBuddy.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test WoWBuddy.sln --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  # A faster signal on everything that is not WPF. Catches most breakage in a fraction of
  # the time, and proves the non-UI projects carry no accidental Windows-desktop dependency.
  linux:
    name: Build and test (Linux, no UI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore WoWBuddy.NoUI.slnf

      - name: Build
        run: dotnet build WoWBuddy.NoUI.slnf --configuration Release --no-restore

      - name: Test
        run: dotnet test WoWBuddy.NoUI.slnf --configuration Release --no-build --verbosity normal
